<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Return to your focus site — Whistler</title>
  </head>
  <body class="away-prompt">
    <main class="alert-shell">
      <div class="alert-mark" aria-hidden="true">
        <img src="/icons/whistler.svg" width="34" height="34" alt="" />
      </div>
      <div class="alert-copy">
        <p id="eyebrow">Whistler</p>
        <h1>You left your focus site</h1>
        <p id="alert-message">Return to the site you intended to focus on, or disable focus.</p>
        <p id="focus-page" class="focus-page"></p>
      </div>
      <div class="actions">
        <button id="primary-action" class="primary" type="button">Return to focused site</button>
        <button id="stop-action" class="secondary" type="button">Disable focus</button>
      </div>
    </main>
    <script type="module" src="/away-toolbar.ts"></script>
  </body>
</html>
